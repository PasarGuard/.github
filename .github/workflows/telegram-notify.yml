name: Reusable Telegram Notifier

on:
  workflow_call:
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      GITHUB_TOKEN:
        required: false
    inputs:
      telegram_targets:
        required: true
        type: string

jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TARGETS: ${{ inputs.telegram_targets }}
        run: |
          # ── Helpers ────────────────────────────────────────────────────────────
          html_escape() {
            echo "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g; s/'"'"'/\&#39;/g'
          }

          # Telegram HTML-mode hard limit is 4096 UTF-8 chars.
          # We leave ~200 chars headroom for the header/footer added later.
          MAX_MSG_LEN=4096
          COMMITS_BLOCK_LIMIT=2000   # max chars for the commits section

          truncate_commits() {
            local block="$1"
            if [[ ${#block} -le $COMMITS_BLOCK_LIMIT ]]; then
              echo "$block"
            else
              # Keep trimming lines from the end until it fits, then add a note
              local trimmed=""
              local dropped=0
              while IFS= read -r line; do
                if [[ $(( ${#trimmed} + ${#line} + 1 )) -le $(( COMMITS_BLOCK_LIMIT - 40 )) ]]; then
                  trimmed+="$line"$'\n'
                else
                  (( dropped++ ))
                fi
              done <<< "$block"
              echo "${trimmed}… <i>and $dropped more commit(s)</i>"
            fi
          }

          truncate_message() {
            local msg="$1"
            if [[ ${#msg} -le $MAX_MSG_LEN ]]; then
              echo "$msg"
            else
              # Hard-truncate and append a note so the message stays valid HTML
              echo "${msg:0:$(( MAX_MSG_LEN - 60 ))}"$'\n\n<i>⚠️ Message truncated — too many changes.</i>'
            fi
          }

          LOG_BUFFER=""
          log() { LOG_BUFFER+="$1"$'\n'; }

          # ── Build escaped commits block ────────────────────────────────────────
          build_commits_block() {
            local raw="$1"
            local escaped=""
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              if [[ "$line" =~ \(([a-f0-9]{7})\)$ ]]; then
                local HASH="${BASH_REMATCH[1]}"
                local PREFIX="${line% (*}"
                local ESC_PREFIX
                ESC_PREFIX=$(html_escape "$PREFIX")
                local ESC_HASH
                ESC_HASH=$(html_escape "$HASH")
                escaped+="$ESC_PREFIX (<code>$ESC_HASH</code>)"$'\n'
              else
                escaped+=$(html_escape "$line")$'\n'
              fi
            done <<< "$raw"
            truncate_commits "$escaped"
          }

          # ── Push event ────────────────────────────────────────────────────────
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BRANCH=$(html_escape "${{ github.ref_name }}")
            ACTOR=$(html_escape "${{ github.actor }}")
            REPO=$(html_escape "${{ github.repository }}")

            COMPARE_URL="${{ github.event.compare }}"
            COMPARE_URL="${COMPARE_URL#"${COMPARE_URL%%[![:space:]]*}"}"
            COMPARE_URL="${COMPARE_URL%"${COMPARE_URL##*[![:space:]]}"}"

            EVENT_STATUS="🔔 <b>New Push to $REPO / $BRANCH</b>"

            COMMITS_RAW=$(echo '${{ toJSON(github.event.commits) }}' \
              | jq -r '.[] | "- " + (.message | gsub("\n"; " ") | gsub("\r"; " ")) + " (" + (.id | .[0:7]) + ")"' \
              | head -n 10)

            COMMITS_BLOCK=$(build_commits_block "$COMMITS_RAW")

            MESSAGE="$EVENT_STATUS"$'\n\n'"👤 By: $ACTOR"$'\n'"🔗 <a href=\"$COMPARE_URL\">View Commits</a>"$'\n\n'"<b>Commits:</b>"$'\n'"$COMMITS_BLOCK"

          # ── Pull Request event ────────────────────────────────────────────────
          else
            ACTOR=$(html_escape "${{ github.actor }}")
            PR_TITLE=$(html_escape "${{ github.event.pull_request.title }}")
            PR_URL="${{ github.event.pull_request.html_url }}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            REPO=$(html_escape "${{ github.repository }}")

            if [[ "${{ github.event.action }}" == "opened" ]]; then
              PR_STATUS="📢 <b>New Pull Request Opened — $REPO</b>"
            elif [[ "${{ github.event.action }}" == "closed" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
              PR_STATUS="✅ <b>Pull Request Merged — $REPO</b>"
            else
              PR_STATUS="❌ <b>Pull Request Closed Without Merging — $REPO</b>"
            fi

            COMMITS_RAW=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER/commits" \
              | jq -r '.[] | "- " + (.commit.message | gsub("\n"; " ") | gsub("\r"; " ")) + " (" + (.sha | .[0:7]) + ")"' \
              | head -n 10)

            COMMITS_BLOCK=$(build_commits_block "$COMMITS_RAW")

            MESSAGE="$PR_STATUS"$'\n\n'"👤 By: $ACTOR"$'\n'"📝 $PR_TITLE"$'\n'"🔗 <a href=\"$PR_URL\">View Pull Request</a>"$'\n\n'"<b>Commits:</b>"$'\n'"$COMMITS_BLOCK"
          fi

          # ── Final length guard ─────────────────────────────────────────────────
          MESSAGE=$(truncate_message "$MESSAGE")

          # ── Debug log setup ───────────────────────────────────────────────────
          log "=== GitHub Event Details ==="
          log "Event: ${{ github.event_name }}"
          log "Action: ${{ github.event.action }}"
          log "Actor: ${{ github.actor }}"
          log "Repository: ${{ github.repository }}"
          log "Ref: ${{ github.ref_name }}"
          log ""
          log "=== Telegram Message ==="
          log "$MESSAGE"
          log "Message length: ${#MESSAGE}"
          log ""

          # ── Send to all targets ───────────────────────────────────────────────
          IFS=',' read -ra TARGETS <<< "$TELEGRAM_TARGETS"
          log "Targets: $TELEGRAM_TARGETS"

          SEND_FAILED=false

          for TARGET in "${TARGETS[@]}"; do
            TARGET="${TARGET#"${TARGET%%[![:space:]]*}"}"   # trim leading spaces
            TARGET="${TARGET%"${TARGET##*[![:space:]]}"}"   # trim trailing spaces

            if [[ "$TARGET" == *"^"* ]]; then
              CHAT_ID=$(echo "$TARGET" | cut -d'^' -f1)
              TOPIC_ID=$(echo "$TARGET" | cut -d'^' -f2)
            else
              CHAT_ID="$TARGET"
              TOPIC_ID=""
            fi

            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" \
              ${TOPIC_ID:+-d "message_thread_id=$TOPIC_ID"} \
              -d "parse_mode=HTML" \
              --data-urlencode "text=$MESSAGE")

            if echo "$RESPONSE" | grep -q '"ok":true'; then
              echo "✅ Sent to $CHAT_ID"
            else
              SEND_FAILED=true
              ERROR_DESC=$(echo "$RESPONSE" | jq -r '.description // "unknown"' 2>/dev/null)
              log "❌ Failed for $CHAT_ID: $ERROR_DESC"
              log "Response: $RESPONSE"
            fi
          done

          if [[ "$SEND_FAILED" == "true" ]]; then
            echo "❌ One or more notifications failed. Debug logs:"
            echo "$LOG_BUFFER"
            exit 1
          else
            echo "✅ All notifications sent."
          fi
